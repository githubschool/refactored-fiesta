    post:
      summary: Initiate Payment Stop
      description: |
        Initiates an asynchronous stop on a payment that has already been released to the rail (ACH or check) but has not yet cleared. Use Initiate Payment Cancellation for payments that are still `SCHEDULED`.

        Asynchronous action endpoint. Requires a mandatory `reason`. Returns the full Payment object (mirror-GET).
      tags:
        - Payment
      operationId: initiatePaymentStop
      security:
        - BearerAuth: []
      parameters:
        - name: settlementId
          in: path
          required: true
          description: Settlement ID (UUID).
          schema:
            type: string
        - name: paymentId
          in: path
          required: true
          description: Payment ID (UUID).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - CONSUMER_REQUEST
                    - OVERPAYMENT_REFUND
                    - PROGRAM_EXIT
                    - HARDSHIP
                    - DUPLICATE_DEPOSIT
                    - DISPUTE_RESOLUTION
                    - OTHER
                  description: Reason for the action. Required for audit and compliance.
                notes:
                  type: string
                  maxLength: 255
                  description: Optional latest note (max 255 chars). Free-text.
                metaData:
                  type: object
                  additionalProperties:
                    type: string
                  maxProperties: 50
                  description: Optional client metaData (max 50 keys, full-replace semantics).
            example:
              reason: CONSUMER_REQUEST
              notes: Cancelled at consumer request via support channel.
      responses:
        '202':
          description: Accepted — action queued. Final state transition is webhook-driven.
          content:
            application/json:
              example:
                status: SUCCESS
                message: Payment action accepted and queued.
                data:
                  id: 5f4a2c91-3b8e-4d0a-9c1f-2b6e8f3d7a40
                  status: SCHEDULED
              schema:
                type: object
                properties:
                  status:
                    type: string
                    readOnly: true
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    description: Full Payment object (mirror-GET).
        '400':
          description: Bad Request — validation error.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: d3bd5586-19c5-426e-9ddc-c5a5374dfc14
        '401':
          description: Unauthorized.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 2be5f828-6363-4737-910b-85f965f760bc
        '404':
