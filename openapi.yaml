    post:
      summary: Initiate Withdrawal Stop
      description: |
        Initiates an asynchronous stop on a CHECK-method withdrawal that has already been released to the mail rail but has not yet been delivered to the consumer's bank.

        Allowed only for CHECK withdrawals when status = SUBMITTED and checkDetails.status is in {IN_TRANSIT, OUT_FOR_DELIVERY} and not CLEARED. Returns 409 if state is incorrect.

        Status transitions to STOPPED.
      tags:
        - Withdrawal
      operationId: initiateWithdrawalStop
      security:
        - BearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
          description: Enrollment ID (UUID).
        - name: withdrawalId
          in: path
          required: true
