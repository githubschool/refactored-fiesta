            application/json:
              example:
                status: SUCCESS
                message: Withdrawal cancellation initiated
                data:
                  id: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  externalReferenceId: EXT-WTH-001
                  enrollmentId: d4a6fbeb-ae7b-4f9d-c081-3b1e5f4d6c7a
                  amount: 500.00
                  dueDate: '2025-09-15'
                  method: ACH
                  reason: CONSUMER_REQUEST
                  bankAccountId: e5b7acfc-bf8c-4a0e-d192-4c2f6a5e7d8b
                  addressId:
                  checkDetails:
                  status: SCHEDULED
                  notes: Consumer called requesting cancellation
                  metaData:
                    source: api
                    campaign: q3_disbursement
                  auditInfo:
                    created:
                      at: '2025-09-01T10:00:00Z'
