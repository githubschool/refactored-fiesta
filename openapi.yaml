  /api/v1/enrollments/{enrollmentId}/withdrawals:
    post:
      summary: Create Withdrawal
      description: |
        Creates a single withdrawal under an enrollment. In case of ACH, the withdrawal will use the primary bankaccount associated with enrollment and the mode of transmission will be Standard ACH. In case of Check it will be dispatched by Standard Mail to the Mailing address associated with the enrollment. If there is no maling address then it will sent to the permanent address associated with the enrollment. Withdrwal is allowed only if at least one draft has been executed against the enrollment and there is sufficient balance.
      tags:
        - Withdrawal
      operationId: createWithdrawal
      security:
        - BearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
          description: Enrollment ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalReferenceId:
                  type: string
                  description: Optional client-supplied reference for idempotency and reconciliation.
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                  description: Withdrawal amount in dollars. Must be at least 0.01.
                dueDate:
                  type: string
                  format: date
                  description: Date the withdrawal should be processed. Must be today or a future date (UTC).
                method:
                  type: string
                  enum:
                    - ACH
                    - CHECK
                  description: Disbursement method. Only ACH and CHECK are supported.
                reason:
                  type: string
                  enum:
                    - CONSUMER_REQUEST
                    - OVERPAYMENT_REFUND
                    - PROGRAM_EXIT
                    - HARDSHIP
                    - DUPLICATE_DEPOSIT
                    - DISPUTE_RESOLUTION
                    - OTHER
                  description: Reason for the withdrawal.
                notes:
                  type: string
                  maxLength: 255
                  description: Latest note for this record (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
                metaData:
                  type: object
                  description: Custom key-value pairs (max 50 properties). This field is fully replaced on update — include all desired keys in each request. Omitted keys are removed.
                  additionalProperties:
                    type: string
                  maxProperties: 50
              required:
                - amount
                - dueDate
                - method
                - reason
            example:
              externalReferenceId: EXT-WTH-001
              amount: 500.00
              dueDate: '2025-09-15'
              method: ACH
              reason: CONSUMER_REQUEST
              notes: Consumer requested partial withdrawal
              metaData:
                source: api
                campaign: q3_disbursement
      responses:
        '201':
          description: Withdrawal created successfully (mirror-GET full object).
          content:
            application/json:
              example:
                status: SUCCESS
                message: Withdrawal created successfully
                data:
                  id: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  externalReferenceId: EXT-WTH-001
                  enrollmentId: d4a6fbeb-ae7b-4f9d-c081-3b1e5f4d6c7a
                  amount: 500.00
                  dueDate: '2025-09-15'
                  method: ACH
                  reason: CONSUMER_REQUEST
                  bankAccountId: e5b7acfc-bf8c-4a0e-d192-4c2f6a5e7d8b
                  addressId:
                  checkDetails:
                  status: SCHEDULED
                  notes: Consumer requested partial withdrawal
                  metaData:
                    source: api
                    campaign: q3_disbursement
                  auditInfo:
                    created:
                      at: '2025-09-01T10:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2025-09-01T10:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Withdrawal ID (UUID).
                      externalReferenceId:
                        type: string
                        maxLength: 50
                        description: Client-supplied reference for idempotency and reconciliation.
                      enrollmentId:
                        type: string
                        description: Parent enrollment ID (UUID).
                      amount:
                        type: number
                        format: decimal
                        minimum: 0.01
                      dueDate:
                        type: string
                        format: date
                      method:
                        type: string
                        enum:
                          - ACH
                          - CHECK
                      reason:
                        type: string
                        enum:
                          - CONSUMER_REQUEST
                          - OVERPAYMENT_REFUND
                          - PROGRAM_EXIT
                          - HARDSHIP
                          - DUPLICATE_DEPOSIT
                          - DISPUTE_RESOLUTION
                          - OTHER
                      bankAccountId:
                        type:
                          - string
                          - 'null'
                        description: System-selected bank account (ACH). Null for CHECK.
                      addressId:
                        type:
                          - string
                          - 'null'
                        description: System-selected address (CHECK). Null for ACH.
                      checkDetails:
                        type:
                          - object
                          - 'null'
                        description: Check details (CHECK only). Null for ACH withdrawals.
                        properties:
                          status:
                            type: string
                            enum:
                              - PRINTED
                              - MAILED
                              - IN_TRANSIT
                              - OUT_FOR_DELIVERY
                              - DELIVERED
                              - RETURNED_TO_SENDER
                              - STOP_REQUESTED
                              - CLEARED
                            description: "Check lifecycle status: PRINTED → MAILED → IN_TRANSIT → OUT_FOR_DELIVERY → DELIVERED | RETURNED_TO_SENDER. STOP_REQUESTED is an in-progress state pending bank confirmation. CLEARED is terminal."
                          frontImageDocumentId:
                            type:
                              - string
                              - 'null'
                            description: Document ID for the front image of the check.
                          backImageDocumentId:
                            type:
                              - string
                              - 'null'
                            description: Document ID for the back image of the check.
                      status:
                        type: string
                        enum:
                          - SCHEDULED
                          - IN_PROCESS
                          - SUBMITTED
                          - COMPLETED
                          - SUCCESS
                          - RETURNED
                          - FAILED
                          - CANCELLED
                          - STOPPED
                        description: |
                          Withdrawal lifecycle status.

                          Allowed transitions:
                          - SCHEDULED → IN_PROCESS
                          - IN_PROCESS → SUBMITTED (W)
                          - SUBMITTED → COMPLETED (W)
                          - COMPLETED → RETURNED (Terminal) (W,E)
                          - COMPLETED → SUCCESS (Terminal) (W)
                          - SUBMITTED → FAILED (Terminal) (W,E)
                          - SCHEDULED → CANCELLED (Terminal)
                          - IN_PROCESS → STOPPED (Terminal) (W)
                          - SUBMITTED → STOPPED (Terminal) (W)
                          - COMPLETED → STOPPED (Terminal) (W)

                          `STOPPED` is reached only for CHECK withdrawals after the bank confirms a stop request triggered by `initiateStop`; it is system-set via webhook.

                          Typical ACH path: SCHEDULED → IN_PROCESS → SUBMITTED → COMPLETED → SUCCESS.

                          For CHECK withdrawals, shipment milestones are tracked separately in the nested field `checkDetails.status` — values: `PRINTED`, `MAILED`, `IN_TRANSIT`, `OUT_FOR_DELIVERY`, `DELIVERED`, `RETURNED_TO_SENDER`, `STOP_REQUESTED`, `CLEARED`. These are **not** top-level `status` values. The top-level `status` remains `SUBMITTED` throughout shipment and only advances to `COMPLETED` once funds clear.
                      notes:
                        type: string
                        maxLength: 255
                        description: Latest note for this record (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
                      metaData:
                        type: object
                        additionalProperties:
                          type: string
                        maxProperties: 50
                      auditInfo:
                        type: object
                        properties:
                          created:
                            type: object
                            properties:
