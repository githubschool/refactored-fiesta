  /api/v1/enrollments/{enrollmentId}/drafts:
    post:
      summary: Create Draft
      description: Creates a new draft record in SCHEDULED status for the specified enrollment. The enrollment must be in ACTIVE status. The `dueDate` must be today or a future date. Authorization details are captured via the nested `authorization` object. When `acceptDuplicate` is YES, the system allows processing a duplicate draft (same consumer, same bank account, same due date, and same amount). When `acceptDuplicate` is NO (default), duplicate drafts are rejected with a 422 error.
      tags:
        - Draft
      operationId: post_create_a_draft
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Draft created successfully
          content:
            application/json:
              example:
                status: SUCCESS
                message: Draft created successfully
                data:
                  draftId: DRF-2025-000001
                  enrollmentId: d4a6fbeb-ae7b-4f9d-c081-3b1e5f4d6c7a
                  externalReferenceId: EXT-DRF-001
                  type: DRAFT
                  amount: 450.0
                  dueDate: '2025-09-01'
                  frequency: MONTHLY
                  method: ACH
                  acceptDuplicate: 'NO'
                  notes: First monthly draft
                  authorization:
                    mode: ONLINE
                    documentId:
                  status: SCHEDULED
                  metaData:
                    source: api
                    campaign: onboarding_q3
                  auditInfo:
                    created:
                      at: '2025-08-20T10:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2025-08-20T10:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
              schema:
                type: object
                properties:
                  status:
                    type: string
                    readOnly: true
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      draftId:
                        type: string
                      enrollmentId:
                        type: string
                      externalReferenceId:
                        type: string
                      type:
                        type: string
                        enum:
                          - PRE_NOTE
                          - DRAFT
