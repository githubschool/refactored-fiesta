                        at: '2026-04-23T17:20:00Z'
                        by:
                          id: 5c2e1363-26f3-4175-48a9-b39d0d1cf4e5
                          name: Ops User
                  - note: Consumer SSN updated; bank statement uploaded; ready for verification.
                    auditInfo:
