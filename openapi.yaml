components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUCCESS
        message:
          type: string
        data:
          type: object
    ListEnvelope:
      type: object
      properties:
        status:
          type: string
          enum:
            - SUCCESS
        message:
          type: string
        data:
          type: array
          items:
            type: object
    ErrorItem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: '^ERR-\d+$'
          description: Stable catalog code. Clients match on this, not on message.
        message:
          type: string
          description: Illustrative human-readable text. May vary across releases; do not parse.
        id:
          type: string
          format: uuid
          description: |
            Optional. UUID of the EXISTING/blocking record on a 409 Conflict
            (e.g., the duplicate consumer). Always paired with externalReferenceId
            when both are present. Omitted on non-409 responses.
        externalReferenceId:
          type: string
          description: |
            Optional. externalReferenceId of the existing/blocking record on a
            409 Conflict. Always paired with id when both are present.
    ErrorEnvelope:
      type: object
      required:
        - status
        - errors
        - traceId
      properties:
        status:
          type: string
          readOnly: true
          enum:
            - FAILURE
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorItem'
        traceId:
          type: string
          format: uuid
          description: Request correlation ID. Always present.
    DocumentType:
      type: string
      description: Master enumeration of document types accepted across all Document upload endpoints. Server-side validation accepts any value from this list. Each parent entity surfaces a curated subset (see x-suggested-types) for documentation/UX guidance only.
      enum:
        - ENROLLMENT_AGREEMENT
        - LIMITED_POWER_OF_ATTORNEY
        - DEBIT_AUTHORIZATION
        - BANK_ACCOUNT_AUTHORIZATION
        - PROGRAM_AMENDMENT
        - PROGRAM_CANCELLATION
        - GOVERNMENT_ISSUED_PHOTO_ID
        - SOCIAL_SECURITY_CARD
        - PROOF_OF_ADDRESS
        - INCOME_VERIFICATION
        - HARDSHIP_LETTER
        - THIRD_PARTY_POWER_OF_ATTORNEY
        - ORIGINAL_CREDITOR_STATEMENTS
        - CREDIT_CARD_STATEMENT
        - CHARGE_OFF_NOTICE
        - COLLECTION_AGENCY_ASSIGNMENT_LETTER
        - DEBT_VALIDATION_LETTER
        - CEASE_AND_DESIST_ACKNOWLEDGMENT
        - JUDGMENT
        - WAGE_GARNISHMENT_NOTICE
        - BANK_LEVY_NOTICE
        - STATUTE_OF_LIMITATIONS_DOCUMENTATION
        - SETTLEMENT_OFFER_LETTER
        - SETTLEMENT_AGREEMENT
        - SETTLEMENT_CONFIRMATION_LETTER
        - PAY_FOR_DELETE_AGREEMENT
        - CREDITOR_CORRESPONDENCE
        - COUNTER_OFFER_DOCUMENTATION
        - DRAFT_HISTORY
        - PAYMENT_RECEIPT
        - RETURNED_PAYMENT_NOTICE
        - RECOUP_AUTHORIZATION
        - REFUND_AUTHORIZATION
        - ADVANCE_AGREEMENT
        - FDCPA_DISPUTE_LETTER
        - REGULATORY_COMPLAINT_DOCUMENTATION
        - ATTORNEY_REPRESENTATION_LETTER
        - LITIGATION_HOLD_NOTICE
        - STATE_SPECIFIC_DISCLOSURE_FORMS
        - DO_NOT_CONTACT_DOCUMENTATION
        - CREDITOR_LETTER_INBOUND
        - CONSUMER_CORRESPONDENCE
        - NOTICE_OF_RIGHT_TO_CANCEL
        - PROGRAM_STATUS_LETTER
        - INTERNAL_CASE_NOTES
        - ACCOUNT_SETTLED_CONFIRMATION
        - PROGRAM_COMPLETION_LETTER
        - FORM_1099_C
        - FINAL_ACCOUNT_SUMMARY
        - ACCOUNT_STATEMENT
        - VOIDED_CHECK
        - W9
        - FEE_SCHEDULE
        - OTHER
    AuditInfo:
      type: object
      description: Standard audit envelope capturing creation and last-update actor + timestamp.
      properties:
        created:
          type: object
          properties:
            at:
              type: string
              format: date-time
              description: Creation timestamp (UTC)
            by:
              type: object
              properties:
                id:
                  type: string
                  description: Actor user UUID
                name:
                  type: string
                  description: Actor display name
        updated:
          type: object
          properties:
            at:
              type: string
              format: date-time
              description: Last update timestamp (UTC)
            by:
              type: object
              properties:
                id:
                  type: string
                  description: Actor user UUID
                name:
                  type: string
                  description: Actor display name
    Batch:
      type: object
      description: Asynchronous batch job. All-or-nothing semantics at the entity level.
      properties:
        batchId:
          type: string
          description: UUID of the batch job.
        batchEntityType:
          type: string
          enum: [DRAFT, FEE]
          description: Child entity type produced by this batch.
        operationType:
          type: string
          enum: [CREATE, UPDATE, CANCEL]
        status:
          type: string
          enum: [QUEUED, IN_PROGRESS, COMPLETE, UNEXPECTED_ERROR]
        batchSize:
          type: integer
          description: Total number of items in the submitted batch.
        successCount:
          type: integer
          description: Number of items processed successfully. Populated once status = COMPLETE.
        failureCount:
          type: integer
          description: Number of items that failed processing. Populated once status = COMPLETE.
        submittedAt:
          type: string
          format: date-time
          description: UTC timestamp when the batch was queued.
        startedAt:
          type: string
          format: date-time
          description: UTC timestamp when processing started. Absent until status = IN_PROGRESS.
        completedAt:
          type: string
          format: date-time
          description: UTC timestamp when processing finished. Absent until terminal state.
        responses:
          type: array
          description: Per-item failure detail. Present only when failureCount > 0; omitted on full success. Each entry mirrors the original input item plus an `error` object.
          items:
            $ref: '#/components/schemas/BatchResponseItem'
        metaData:
          type: object
          description: Caller-supplied key-value metadata.
        notes:
          type: string
          maxLength: 255
          description: Latest note for this batch (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
    BatchListItem:
      type: object
      description: Lean batch summary for list responses. Excludes per-item `responses[]`.
      properties:
        batchId:
          type: string
        batchEntityType:
          type: string
          enum: [DRAFT, FEE]
        operationType:
          type: string
          enum: [CREATE, UPDATE, CANCEL]
        status:
          type: string
          enum: [QUEUED, IN_PROGRESS, COMPLETE, UNEXPECTED_ERROR]
        batchSize:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    BatchResponseItem:
      type: object
      description: A single failed item from a batch. Mirrors the original input record fields and adds an `error` object. Only failures appear in `responses[]`.
      properties:
        index:
          type: integer
          description: Zero-based index of this item in the originally submitted array.
        errors:
        - code: ERR-###
          message: <error message>
        traceId: 6d9abba1-a49e-48ef-9e92-832123e858aa
      additionalProperties: true
    Exception:
      type: object
      description: An exception is an anomaly flagged on an entity that requires manual remediation. Exceptions follow the state machine `CREATED → ASSIGNED ⇄ IN_VERIFICATION → RESOLVED` (terminal), with re-assignment loops permitted (`ASSIGNED → ASSIGNED`, `IN_VERIFICATION → ASSIGNED`). Status is advanced via dedicated action endpoints.
      properties:
        exceptionId:
          type: string
          readOnly: true
          description: Exception ID (UUID).
        internalTicketId:
          type: string
          description: Identifier of the corresponding ticket in the internal ticketing platform. Notes posted via the action endpoints are stored as comments on this ticket.
        queue:
          type: string
          description: Functional queue this exception belongs to. Drives routing, SLAs, and assigneeRole defaults.
          enum:
            - CONSUMER_CIP_VERIFICATION_FAILED
            - CONSUMER_OFAC_VERIFICATION_FAILED
            - BANK_ACCOUNT_VERIFICATION_FAILED
            - ENROLLMENT_ACTIVATION_BLOCKED
            - ENROLLMENT_CANCELLATION_BLOCKED
            - DRAFT_RETURNED
            - WITHDRAWAL_EXCEPTION
        entityType:
          type: string
          description: Type of the entity the exception is raised against.
          enum:
            - ENROLLMENT
            - DRAFT
            - WITHDRAWAL
            - FEE
            - BANK_ACCOUNT
            - CONSUMER
        entityId:
          type: string
          description: ID of the entity instance the exception is raised against (UUID).
        status:
          type: string
          readOnly: true
          description: |
            Lifecycle status. Allowed transitions:
            `CREATED → ASSIGNED` (assignException),
            `ASSIGNED → ASSIGNED` (re-assign),
            `ASSIGNED → IN_VERIFICATION` (verifyException),
            `IN_VERIFICATION → ASSIGNED` (re-assign for more remediation),
            `IN_VERIFICATION → RESOLVED` (resolveException, terminal).
          enum:
            - CREATED
            - ASSIGNED
            - IN_VERIFICATION
            - RESOLVED
        assigneeRole:
          type: string
          description: Group currently responsible for working the exception.
          enum:
            - SUBSCRIBER
            - INTERNAL_BANKING_OPS
            - INTERNAL_COMPLIANCE_OPS
            - INTERNAL_PAYMENT_OPS
        reasons:
          type: array
          minItems: 1
          description: One or more structured reasons describing the event that triggered this exception. Populated at creation; not appended to by action endpoints. Each reason carries a machine-readable `reasonCode`, a human-readable `reasonMessage`, and a free-text `reasonData` string with supporting context (see the Reason Codes catalog in the Exception entity docs).
          items:
            $ref: '#/components/schemas/ExceptionReason'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ExceptionResolution'
            - type: "null"
          description: Populated only when `status = RESOLVED`. Null otherwise.
        helpLink:
          type: string
          format: uri
          description: Documentation URL for the queue this exception belongs to.
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
      required:
        - queue
        - entityType
        - entityId
        - assigneeRole
        - reasons
    ExceptionReason:
      type: object
      description: A structured reason record attached to an exception describing the triggering event. Populated at creation; additional reasons may be appended via the appendReason action.
      properties:
        reasonCode:
          type: string
          description: Machine-readable reason code from the closed Reason Catalog.
          example: DOCUMENT_VERIFICATION_FAILED
        reasonDescription:
          type: string
          description: Human-readable description of this reason, suitable for surfacing in UI.
          example: Government-issued ID failed verification — DOB and address do not match consumer record.
        reasonDetails:
          type: object
          description: Structured supporting context for this reason. Shape varies by `reasonCode`. When the failure relates to specific fields, `fieldsToReview` is a simple array of field names that need review.
          additionalProperties: true
          example:
            documentId: doc_5a4b3c2d-1e9f-4a8b-b7c6-d5e4f3a2b1c0
            documentType: GOVERNMENT_ISSUED_PHOTO_ID
            fieldsToReview:
              - dateOfBirth
              - addressLine1
              - expirationDate
        requiresContact:
          type: boolean
          description: Indicates that resolving this reason requires the subscriber to contact the consumer (e.g. to collect a corrected document, re-verify identity, or re-authorize a bank account).
          default: false
          example: true
      required:
        - reasonCode
        - reasonDescription
    ExceptionResolution:
      type: object
      description: Resolution metadata. Populated only when `status = RESOLVED`.
      properties:
        resolutionCode:
          type: string
          description: Machine-readable resolution category.
          enum:
            - CONSUMER_UPDATED
            - DOCUMENT_UPLOADED
            - MANUAL_OVERRIDE
            - RETRY_SUCCEEDED
            - OTHER
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp the exception was resolved (UTC).
      required:
        - resolutionCode
        - resolvedAt
    ExceptionListItem:
      type: object
      description: Compact projection returned by the list endpoint. Full reason payloads, resolution detail, helpLink, internalTicketId, and auditInfo are available via Fetch Exception.
      properties:
        exceptionId:
          type: string
          description: Exception ID (UUID).
        queue:
          type: string
          enum:
            - CONSUMER_CIP_VERIFICATION_FAILED
            - CONSUMER_OFAC_VERIFICATION_FAILED
            - BANK_ACCOUNT_VERIFICATION_FAILED
            - ENROLLMENT_ACTIVATION_BLOCKED
            - ENROLLMENT_CANCELLATION_BLOCKED
            - DRAFT_RETURNED
            - WITHDRAWAL_EXCEPTION
        entityType:
          type: string
          enum:
            - ENROLLMENT
            - DRAFT
            - WITHDRAWAL
            - FEE
            - BANK_ACCOUNT
            - CONSUMER
        entityId:
          type: string
          description: Entity instance ID (UUID).
        status:
          type: string
          enum:
            - CREATED
            - ASSIGNED
            - IN_VERIFICATION
            - RESOLVED
        assigneeRole:
          type: string
          enum:
            - SUBSCRIBER
            - INTERNAL_BANKING_OPS
            - INTERNAL_COMPLIANCE_OPS
            - INTERNAL_PAYMENT_OPS
        primaryReasonCode:
          type: string
          description: Code of the first reason in `reasons[]`. Provided as a list-view convenience.
        reasonCount:
          type: integer
          minimum: 1
          description: Number of reasons attached to this exception.
        createdAt:
          type: string
          format: date-time
          description: Mirror of `auditInfo.created.at` (UTC).
        updatedAt:
          type: string
          format: date-time
          description: Mirror of `auditInfo.updated.at` (UTC).
    ExceptionNote:
      type: object
      description: A single note/comment on the exception's linked internal ticket, surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.
      properties:
        note:
          type: string
          description: Free-text note submitted via an action endpoint.
        auditInfo:
          $ref: '#/components/schemas/AuditInfo'
      required:
        - note
        - auditInfo
    CreateExceptionRequest:
      type: object
      properties:
        internalTicketId:
          type: string
          description: Identifier of the corresponding ticket in the internal ticketing platform.
        queue:
          type: string
          enum:
            - CONSUMER_CIP_VERIFICATION_FAILED
            - CONSUMER_OFAC_VERIFICATION_FAILED
            - BANK_ACCOUNT_VERIFICATION_FAILED
            - ENROLLMENT_ACTIVATION_BLOCKED
            - ENROLLMENT_CANCELLATION_BLOCKED
            - DRAFT_RETURNED
            - WITHDRAWAL_EXCEPTION
        entityType:
          type: string
          enum:
            - ENROLLMENT
            - DRAFT
            - WITHDRAWAL
            - FEE
            - BANK_ACCOUNT
            - CONSUMER
        entityId:
          type: string
          description: ID of the entity instance the exception is raised against (UUID).
        assigneeRole:
          type: string
          enum:
            - SUBSCRIBER
            - INTERNAL_BANKING_OPS
            - INTERNAL_COMPLIANCE_OPS
            - INTERNAL_PAYMENT_OPS
        helpLink:
          type: string
          format: uri
          description: Documentation URL for the queue this exception belongs to.
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExceptionReason'
      required:
        - queue
        - entityType
        - entityId
        - assigneeRole
        - reasons
    AssignExceptionRequest:
      type: object
      properties:
        assigneeRole:
          type: string
          enum:
            - SUBSCRIBER
            - INTERNAL_BANKING_OPS
            - INTERNAL_COMPLIANCE_OPS
            - INTERNAL_PAYMENT_OPS
          description: New assignee group.
        notes:
          type: string
          maxLength: 255
          description: Required free-text note (max 255 chars). Not stored on the Exception object; forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.
      required:
        - assigneeRole
        - notes
    VerifyExceptionRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 255
          description: Required free-text note (max 255 chars). Not stored on the Exception object; forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.
      required:
        - notes
    ResolveExceptionRequest:
      type: object
      properties:
        resolutionCode:
          type: string
          enum:
            - CONSUMER_UPDATED
            - DOCUMENT_UPLOADED
            - MANUAL_OVERRIDE
            - RETRY_SUCCEEDED
            - OTHER
          description: Machine-readable resolution category. Required.
        notes:
          type: string
          maxLength: 255
          description: Required free-text note (max 255 chars). Not stored on the Exception object; forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.
      required:
        - resolutionCode
        - notes
