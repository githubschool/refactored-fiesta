  /api/v1/enrollments/{enrollmentId}/withdrawals/list:
    post:
      summary: List Withdrawals
      description: Returns a paginated list of withdrawals for an enrollment. Supports filtering by status, method, reason, and due-date range. Default sort is reverse chronological by dueDate (newest first).
      tags:
        - Withdrawal
      operationId: listWithdrawals
      security:
        - BearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          description: Enrollment UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  description: Filter criteria using field, operator, value pattern.
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Field to filter on (e.g. status, method, reason, dueDate).
                      operator:
                        type: string
                        enum:
                          - eq
                          - neq
                          - gt
                          - gte
                          - lt
                          - lte
                          - in
                          - contains
                      value:
                        description: Filter value (string or array for 'in' operator).
                pagination:
                  type: object
                  description: Pagination options.
                  properties:
                    page:
                      type: integer
                      description: Page number (default 1).
                      default: 1
                    pageSize:
                      type: integer
                      description: Number of results per page (default 25, max 100).
                      default: 25
                      maximum: 100
                sorting:
                  type: object
                  description: Sorting options.
                  properties:
