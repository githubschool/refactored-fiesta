  /api/v1/enrollments/{enrollmentId}:
    get:
      summary: Fetch Enrollment
      description: |
        By default this endpoint returns the compact response (scalars + foreign-key IDs, identical to the Create Enrollment response). Pass `?expand=true` to receive the fully expanded object (with nested consumer, address, bank account, and audit details) shown in the example below.
