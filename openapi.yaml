  /api/v1/bankAccounts/validate:
    post:
      summary: Validate Bank Account
      description: |
        The client sends
        - routing number
        - full account number
        - account holder name
        - account type (optional).

        The API returns whether the bank account and account ownership could be verified, along with normalized bank details.

        accountStatus indicates the result of validating the bank account itself, using the submitted routing number and account number.
        - NOT_INITIATED: Account validation was not started or no account-level result was available.
        - VERIFICATION_SUCCESS: The routing number and account number passed validation.
        - VERIFICATION_FAILED: The routing/account combination failed validation.
        - UNVERIFIED: The provider could not conclusively verify the account.

        ownershipStatus indicates the result of validating account ownership, using the submitted account holder name against ownership information returned by the validation provider.
        - NOT_INITIATED: Ownership/name-match validation was not started or no ownership-level result was available.
        - VERIFICATION_SUCCESS: The submitted account holder name matched the account ownership information.
        - VERIFICATION_FAILED: The submitted account holder name did not match ownership information.
        - UNVERIFIED: The provider could not conclusively verify ownership/name match.

        If the validation provider is unavailable or times out, the API returns 503 SERVICE_UNAVAILABLE so that the client can retry.
      tags:
        - Bank Account
      operationId: post_validate_bank_account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                status: SUCCESS
                message: Bank account validation completed
                data:
                  accountStatus: UNVERIFIED
                  ownershipStatus: UNVERIFIED
                  bankName: JPMorgan Chase
                  achRoutingNumber: '021000021'
                  accountNumberLast4: '6789'
                  accountHolderName: zxcv 243
                  accountType: CHECKING
              schema:
                type: object
                properties:
                  status:
                    type: string
                    readOnly: true
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accountStatus:
                        type: string
                        description: Vendor verification result for the bank account (routing + account number) as assessed by the verification provider.
                        default: NOT_INITIATED
                        enum:
                          - NOT_INITIATED
                          - VERIFICATION_SUCCESS
                          - VERIFICATION_FAILED
                          - UNVERIFIED
                      ownershipStatus:
                        type: string
                        description: Vendor verification result for account ownership (account holder name vs. consumer identity on file).
                        default: NOT_INITIATED
                        enum:
                          - NOT_INITIATED
                          - VERIFICATION_SUCCESS
                          - VERIFICATION_FAILED
                          - UNVERIFIED
                      bankName:
                        type: string
                        description: Resolved bank name from routing number
                      achRoutingNumber:
                        type: string
                      accountNumberLast4:
                        type: string
                      accountHolderName:
                        type: string
                      accountType:
                        type: string
                        enum:
                          - CHECKING
                          - SAVINGS
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 5b5c3294-cfd1-4c26-9ca8-f4e877156b40
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: c5ffc120-e20d-453b-980e-4d8a9c6d0e32
        '503':
          description: Service Unavailable - The validation provider is unavailable or timed out. The client may retry.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 7b2ce0d9-aa97-424c-9ba3-d1655b14ca98
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                achRoutingNumber:
                  type: string
                  description: 9-digit ABA routing number
                accountNumber:
                  type: string
                  description: Full account number (4-17 alphanumeric digits)
                accountHolderName:
                  type: string
                  maxLength: 50
                  description: Name on the account
                accountType:
                  type: string
                  enum:
                    - CHECKING
                    - SAVINGS
                  description: CHECKING or SAVINGS
              required:
                - achRoutingNumber
                - accountNumber
                - accountHolderName
                - accountType
            example:
              achRoutingNumber: '021000021'
              accountNumber: '111111111'
              accountHolderName: zxcv 243
              accountType: CHECKING
  /api/v1/exceptions:
    post:
      summary: Create Exception
      description: |
        Creates a new exception record for an entity that requires manual remediation. Exceptions are typically generated by upstream automated checks (CIP, OFAC, bank verification, draft processing, etc.) but may also be created via this endpoint by integrations or back-office tools.

        The new exception starts at `status: CREATED`. It is advanced through `ASSIGNED → IN_VERIFICATION → RESOLVED` via the dedicated action endpoints (`assignException`, `verifyException`, `resolveException`). Re-assignment loops (`ASSIGNED → ASSIGNED`, `IN_VERIFICATION → ASSIGNED`) are permitted. Status cannot be set directly through create.

        Returns the full exception object (mirror-GET).
      tags:
        - Exceptions
      operationId: createException
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExceptionRequest'
            example:
              internalTicketId: TCKT-77821
              queue: ENROLLMENT_ACTIVATION_BLOCKED
              entityType: ENROLLMENT
              entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
              assigneeRole: SUBSCRIBER
              helpLink: https://docs.purposefintech.com/exceptions/enrollmentActivationBlocked
              reasons:
                - reasonCode: CIP_FAILURE
                  reasonMessage: CIP failure; update consumer
                  reasonData: 'consumerId=b2e4d9c3-8c5f-4d7b-ae6a-1f9c3d2b4e58; failedFields=ssn,dateOfBirth; provider=LexisNexis; score=42'
                - reasonCode: BANK_ACCOUNT_VERIFICATION_FAILURE
                  reasonMessage: Bank account verification failure; upload bank statement
                  reasonData: 'bankAccountId=c3f5e0d4-9d6a-4e8c-bf7b-2a0d4e3c5f69; method=MICRO_DEPOSIT; attempts=3; remediation=UPLOAD_BANK_STATEMENT'
      responses:
        '201':
          description: Exception created. Returns the full exception object.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Exception'
              example:
                status: SUCCESS
                message: Exception created
                data:
                  exceptionId: d4a6f1e5-ae7b-4f9d-c081-3b1e5f4d6c7a
                  internalTicketId: TCKT-77821
                  queue: ENROLLMENT_ACTIVATION_BLOCKED
                  entityType: ENROLLMENT
                  entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  status: CREATED
                  assigneeRole: SUBSCRIBER
                  reasons:
                    - reasonCode: CIP_FAILURE
                      reasonMessage: CIP failure; update consumer
                      reasonData: 'consumerId=b2e4d9c3-8c5f-4d7b-ae6a-1f9c3d2b4e58; failedFields=ssn,dateOfBirth; provider=LexisNexis; score=42'
                    - reasonCode: BANK_ACCOUNT_VERIFICATION_FAILURE
                      reasonMessage: Bank account verification failure; upload bank statement
                      reasonData: 'bankAccountId=c3f5e0d4-9d6a-4e8c-bf7b-2a0d4e3c5f69; method=MICRO_DEPOSIT; attempts=3; remediation=UPLOAD_BANK_STATEMENT'
                  resolution:
                  helpLink: https://docs.purposefintech.com/exceptions/enrollmentActivationBlocked
                  auditInfo:
                    created:
                      at: '2026-04-23T15:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2026-04-23T15:00:00Z'
                      by:
