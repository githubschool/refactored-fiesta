                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2025-09-04T11:00:00Z'
                      by:
                        id: 5c2e1363-26f3-4175-48a9-b39d0d1cf4e5
                        name: Ops User
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Withdrawal ID (UUID).
                      externalReferenceId:
                        type: string
                        maxLength: 50
                        description: Client-supplied reference for idempotency and reconciliation.
                      enrollmentId:
                        type: string
                        description: Parent enrollment ID (UUID).
                      amount:
                        type: number
                        format: decimal
                        minimum: 0.01
                      dueDate:
                        type: string
                        format: date
                      method:
                        type: string
                        enum:
                          - ACH
                          - CHECK
                      reason:
                        type: string
                        enum:
                          - CONSUMER_REQUEST
                          - OVERPAYMENT_REFUND
                          - PROGRAM_EXIT
                          - HARDSHIP
                          - DUPLICATE_DEPOSIT
