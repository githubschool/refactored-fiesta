  /api/v1/enrollments/composite:
    post:
      summary: Create Enrollment (Composite)
      description: |
        Creates a complete enrollment in a single atomic transaction.

        The request contains all the data necessary to create a set of resources (client, client's address, client's bank account) en route to creating an enrollment. Any failure to create an underlying resource or the enrollment resource stops processing and rolls back the entire transaction i.e. no new resources persist unless all resources, including enrollment, are created successfully.

        If successful, this call creates the following new resources:

        - Primary applicant (client) as entity type consumer
        - Primary applicant's address as entity type Address nested under consumer, with type = PERMANENT_ADDRESS
        - Primary applicant's bank account (at least one) with entity type bankAccount, nested under consumer
        - Enrollment

        This call also optionally creates the following new resources:

        - Optional address with type = MAILING_ADDRESS under the Primary applicant
        - Up to 1 Co-Applicant (coClient) as entity type consumer, with related optional nested addresses and optional nested bank accounts

        The call does not create the following resources:

        - Documents nested under any of the consumer, bankAccount and enrollment resources that are created as part of the call
        - Drafts under enrollment
        - Virtual account (this is only created post-Activation)

        **Order of operations**

        Validations order:

        1. client
        2. client.addresses
        3. client.bankAccounts
        4. coClients[i]
        5. enrollment

        Processing stops at the first validation failure. Upon any failure, no new created resources will persist.

        **Binding rules**

        Only the first address of each type (PERMANENT_ADDRESS, MAILING_ADDRESS) and the first two bank accounts are bound to the enrollment via scalar IDs (permanentAddressId, mailingAddressId, primaryBankAccountId, backupBankAccountId). Any additional addresses or bank accounts submitted in the request are persisted under the consumer but are not bound to this enrollment.
      tags:
        - Enrollment
      operationId: post_composite_enrollment_creation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client
                - settlementFeePercentage
              properties:
                client:
                  type: object
                  description: Primary applicant (nested Consumer with required address + bank).
                  required:
                    - firstName
                    - lastName
                    - emailAddress
                    - phoneNumber
                    - ssn
                    - dateOfBirth
                    - addresses
                    - bankAccounts
                  properties:
                    firstName:
                      type: string
                      maxLength: 50
                    middleInitial:
                      type: string
                      maxLength: 1
                    lastName:
                      type: string
                      maxLength: 50
                    emailAddress:
                      type: string
                      format: email
                      maxLength: 255
                    phoneNumber:
                      type: string
                      pattern: ^\+[1-9]\d{1,14}$
                    ssn:
                      type: string
                      pattern: ^\d{9}$
                      writeOnly: true
                    dateOfBirth:
                      type: string
                      format: date
                      description: Must be ≥ 18 years old.
                    externalReferenceId:
                      type: string
                      maxLength: 50
                    metaData:
                      type: object
                      additionalProperties:
                        type: string
                      maxProperties: 50
                    addresses:
                      type: array
                      minItems: 1
                      description: Must contain exactly one entry with type=PERMANENT_ADDRESS. PO Box rejected for PERMANENT_ADDRESS.
                      items:
                        type: object
                        required:
                          - type
                          - addressLine1
                          - city
                          - state
                          - zipCode
                        properties:
                          type:
                            type: string
                            enum:
                              - PERMANENT_ADDRESS
                              - MAILING_ADDRESS
                          addressLine1:
                            type: string
                            maxLength: 100
                          addressLine2:
                            type: string
                            maxLength: 100
                          city:
                            type: string
                            maxLength: 50
                          state:
                            type: string
                            minLength: 2
                            maxLength: 2
                          zipCode:
                            type: string
                            pattern: ^\d{5}(-\d{4})?$
                          country:
                            type: string
                            default: US
                          externalReferenceId:
                            type: string
                            maxLength: 50
                          metaData:
                            type: object
                            additionalProperties:
                              type: string
                            maxProperties: 50
                    bankAccounts:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - achRoutingNumber
                          - accountNumber
                          - accountType
                          - accountHolderName
                        properties:
                          achRoutingNumber:
                            type: string
                            description: 9-digit ABA. Checksum validated.
                          wireRoutingNumber:
                            type: string
                          accountNumber:
                            type: string
                            writeOnly: true
                            description: 4–17 digits, cannot be all zeros.
                          accountType:
                            type: string
                            enum:
                              - CHECKING
                              - SAVINGS
                          accountHolderName:
                            type: string
                            maxLength: 50
                          accountNickName:
                            type: string
                          externalReferenceId:
                            type: string
                            maxLength: 50
                          metaData:
                            type: object
                            additionalProperties:
                              type: string
                            maxProperties: 50
                coClients:
                  type: array
                  maxItems: 1
                  description: Optional co-applicant (0 or 1). A nested Consumer with same required fields as client. addresses[] and bankAccounts[] are OPTIONAL on the coClient.
                  items:
                    type: object
                    required:
                      - firstName
                      - lastName
                      - emailAddress
                      - phoneNumber
                      - ssn
                      - dateOfBirth
                    properties:
                      firstName:
                        type: string
                        maxLength: 50
                      middleInitial:
                        type: string
                        maxLength: 1
                      lastName:
                        type: string
                        maxLength: 50
                      emailAddress:
                        type: string
                        format: email
                        maxLength: 255
                      phoneNumber:
                        type: string
                        pattern: ^\+[1-9]\d{1,14}$
                      ssn:
                        type: string
                        pattern: ^\d{9}$
                        writeOnly: true
                      dateOfBirth:
                        type: string
                        format: date
                      externalReferenceId:
                        type: string
                        maxLength: 50
                      metaData:
                        type: object
                        additionalProperties:
                          type: string
                        maxProperties: 50
                      addresses:
                        type: array
                        description: Optional. Same schema as client.addresses[] items.
                        items:
                          type: object
                      bankAccounts:
                        type: array
                        description: Optional. Same schema as client.bankAccounts[] items.
                        items:
                          type: object
                settlementFeePercentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Settlement fee percentage. Whole number between 0 and 100.
                externalReferenceId:
                  type: string
                  maxLength: 50
                  description: Client-supplied enrollment-level reference. Unique if provided.
                metaData:
                  type: object
                  additionalProperties:
                    type: string
                  maxProperties: 50
            example:
              settlementFeePercentage: 25
              externalReferenceId: ENR-EXT-2026-04-17-001
              client:
                firstName: Jane
                middleInitial: M
                lastName: Doe
                emailAddress: jane.doe@email.com
                phoneNumber: '+14155551234'
