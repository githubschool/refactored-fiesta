  /api/v1/exceptions/list:
    post:
      summary: List Exceptions
      description: |
        Returns a paginated, filterable list of exceptions. Filters can be combined.

        Common filter combinations:
        - `status: [CREATED, ASSIGNED]` + `assigneeRole: SUBSCRIBER` — work queue for the subscriber.
        - `entityType: ENROLLMENT` + `entityId: <uuid>` — all open exceptions for one enrollment.
        - `queue: BANK_ACCOUNT_VERIFICATION_FAILED` — funnel review.
      tags:
        - Exceptions
      operationId: listExceptions
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                queue:
                  type: array
                  items:
                    type: string
                    enum:
                      - CONSUMER_CIP_VERIFICATION_FAILED
                      - CONSUMER_OFAC_VERIFICATION_FAILED
                      - BANK_ACCOUNT_VERIFICATION_FAILED
                      - ENROLLMENT_ACTIVATION_BLOCKED
                      - ENROLLMENT_CANCELLATION_BLOCKED
                      - DRAFT_RETURNED
                      - WITHDRAWAL_EXCEPTION
                entityType:
                  type: array
                  items:
                    type: string
                    enum:
                      - ENROLLMENT
                      - DRAFT
                      - WITHDRAWAL
                      - FEE
                      - BANK_ACCOUNT
                      - CONSUMER
                entityId:
                  type: string
                  description: Filter to exceptions for a specific entity instance (UUID).
                status:
                  type: array
                  items:
                    type: string
                    enum:
                      - CREATED
                      - ASSIGNED
                      - IN_VERIFICATION
                      - RESOLVED
                assigneeRole:
                  type: array
                  items:
                    type: string
                    enum:
                      - SUBSCRIBER
                      - INTERNAL_BANKING_OPS
                      - INTERNAL_COMPLIANCE_OPS
                      - INTERNAL_PAYMENT_OPS
                createdFrom:
                  type: string
                  format: date-time
                  description: Inclusive lower bound on `auditInfo.created.at` (UTC).
                createdTo:
                  type: string
                  format: date-time
                  description: Inclusive upper bound on `auditInfo.created.at` (UTC).
                page:
                  type: integer
                  minimum: 1
                  default: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 25
            example:
              status:
                - CREATED
                - ASSIGNED
              assigneeRole:
                - SUBSCRIBER
              page: 1
              pageSize: 25
      responses:
        '200':
          description: Paginated list of exceptions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExceptionListItem'
              example:
                status: SUCCESS
                message: Exceptions listed
                data:
                  - exceptionId: d4a6f1e5-ae7b-4f9d-c081-3b1e5f4d6c7a
                    queue: ENROLLMENT_ACTIVATION_BLOCKED
                    entityType: ENROLLMENT
                    entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                    status: ASSIGNED
                    assigneeRole: SUBSCRIBER
                    primaryReasonCode: CIP_FAILURE
                    reasonCount: 2
                    createdAt: '2026-04-23T15:00:00Z'
                    updatedAt: '2026-04-23T15:12:00Z'
                pagination:
                  page: 1
                  pageSize: 25
                  totalRecords: 1
                  totalPages: 1
  /api/v1/exceptions/{exceptionId}/assignException:
    post:
      summary: Assign Exception
      description: |
        Assigns (or re-assigns) an exception to a group. Allowed from `status = CREATED`, `ASSIGNED`, or `IN_VERIFICATION`. Sets `status: ASSIGNED`.

        Re-assignment loops are permitted: `ASSIGNED → ASSIGNED` (rotate within or across groups) and `IN_VERIFICATION → ASSIGNED` (kick back for more remediation).

        Returns `409 Conflict` with `code: INVALID_STATE`, the current `status`, and the existing `exceptionId` if invoked from `RESOLVED`.

        `notes` is required. The note is not stored on the Exception object; it is forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.

        Returns the full exception object (mirror-GET).
      tags:
        - Exceptions
      operationId: assignException
      security:
        - BearerAuth: []
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
          description: Exception ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignExceptionRequest'
            example:
              assigneeRole: INTERNAL_BANKING_OPS
              notes: Routing CIP failure to Banking Ops for outbound consumer call.
      responses:
        '200':
          description: Exception assigned. Returns the full exception object.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Exception'
              example:
                status: SUCCESS
                message: Exception assigned
                data:
                  exceptionId: d4a6f1e5-ae7b-4f9d-c081-3b1e5f4d6c7a
                  internalTicketId: TCKT-77821
                  queue: ENROLLMENT_ACTIVATION_BLOCKED
                  entityType: ENROLLMENT
                  entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  status: ASSIGNED
                  assigneeRole: INTERNAL_BANKING_OPS
                  reasons:
                    - reasonCode: CIP_FAILURE
                      reasonMessage: CIP failure; update consumer
                      reasonData: 'consumerId=b2e4d9c3-8c5f-4d7b-ae6a-1f9c3d2b4e58; failedFields=ssn'
                  resolution:
                  helpLink: https://docs.purposefintech.com/exceptions/enrollmentActivationBlocked
                  auditInfo:
                    created:
                      at: '2026-04-23T15:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2026-04-23T15:12:00Z'
                      by:
                        id: 5c2e1363-26f3-4175-48a9-b39d0d1cf4e5
                        name: Ops User
  /api/v1/exceptions/{exceptionId}/verifyException:
    post:
      summary: Verify Exception
      description: |
        Moves an assigned exception into verification. Allowed only when `status = ASSIGNED`. Sets `status: IN_VERIFICATION`.

        Use this once the assignee has gathered remediation inputs (updated consumer fields, uploaded supporting documents, etc.) and is ready for the verifying party to review.

        Returns `409 Conflict` with `code: INVALID_STATE`, the current `status`, and the existing `exceptionId` if invoked from any other state.

        `notes` is required. The note is not stored on the Exception object; it is forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.

        Returns the full exception object (mirror-GET).
      tags:
        - Exceptions
      operationId: verifyException
      security:
        - BearerAuth: []
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
          description: Exception ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyExceptionRequest'
            example:
              notes: Consumer SSN updated; bank statement uploaded; ready for verification.
      responses:
        '202':
          description: Accepted. Exception moved to IN_VERIFICATION. Returns the full exception object (mirror-GET).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Exception'
              example:
                status: SUCCESS
                message: Exception verification initiated
                data:
                  exceptionId: d4a6f1e5-ae7b-4f9d-c081-3b1e5f4d6c7a
                  internalTicketId: TCKT-77821
                  queue: ENROLLMENT_ACTIVATION_BLOCKED
                  entityType: ENROLLMENT
                  entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  status: IN_VERIFICATION
                  assigneeRole: INTERNAL_BANKING_OPS
                  reasons:
                    - reasonCode: CIP_FAILURE
                      reasonMessage: CIP failure; update consumer
                      reasonData: 'consumerId=b2e4d9c3-8c5f-4d7b-ae6a-1f9c3d2b4e58; failedFields=ssn'
                  resolution:
                  helpLink: https://docs.purposefintech.com/exceptions/enrollmentActivationBlocked
                  auditInfo:
                    created:
                      at: '2026-04-23T15:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2026-04-23T16:05:00Z'
                      by:
                        id: 5c2e1363-26f3-4175-48a9-b39d0d1cf4e5
                        name: Ops User
  /api/v1/exceptions/{exceptionId}/resolveException:
    post:
      summary: Resolve Exception
      description: |
        Internal use only. Resolves a verified exception. Allowed only when `status = IN_VERIFICATION`. Sets `status: RESOLVED` and populates `resolution.resolutionCode` and `resolution.resolvedAt`.

        Returns `409 Conflict` with `code: INVALID_STATE`, the current `status`, and the existing `exceptionId` if invoked from any other state.

        `notes` is required. The note is not stored on the Exception object; it is forwarded to the linked internal ticket (`internalTicketId`) as a comment and surfaced via `GET /api/v1/exceptions/{exceptionId}/notes`.

        Requires `resolutionCode` (enum). Returns the full exception object (mirror-GET).
      tags:
        - Exceptions
      operationId: resolveException
      x-internal: true
      security:
        - BearerAuth: []
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
          description: Exception ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveExceptionRequest'
            example:
              resolutionCode: CONSUMER_UPDATED
              notes: Consumer SSN re-verified by LexisNexis; bank statement matched. Closing exception.
      responses:
        '200':
          description: Exception resolved. Returns the full exception object with `resolution` populated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Exception'
              example:
                status: SUCCESS
                message: Exception resolved
                data:
                  exceptionId: d4a6f1e5-ae7b-4f9d-c081-3b1e5f4d6c7a
                  internalTicketId: TCKT-77821
                  queue: ENROLLMENT_ACTIVATION_BLOCKED
                  entityType: ENROLLMENT
                  entityId: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  status: RESOLVED
                  assigneeRole: INTERNAL_BANKING_OPS
                  reasons:
                    - reasonCode: CIP_FAILURE
                      reasonMessage: CIP failure; update consumer
                      reasonData: 'consumerId=b2e4d9c3-8c5f-4d7b-ae6a-1f9c3d2b4e58; failedFields=ssn'
                  resolution:
                    resolutionCode: CONSUMER_UPDATED
                    resolvedAt: '2026-04-23T17:20:00Z'
                  helpLink: https://docs.purposefintech.com/exceptions/enrollmentActivationBlocked
                  auditInfo:
                    created:
                      at: '2026-04-23T15:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2026-04-23T17:20:00Z'
                      by:
                        id: 5c2e1363-26f3-4175-48a9-b39d0d1cf4e5
                        name: Ops User
  /api/v1/exceptions/{exceptionId}/notes:
    get:
      summary: List Exception Notes
      description: |
        Returns the chronological history of notes posted against this exception via the action endpoints (`assignException`, `verifyException`, `resolveException`). Notes are stored as comments on the linked internal ticket (`internalTicketId`) and are surfaced here for API consumers.

        Returned in reverse-chronological order (newest first).
      tags:
        - Exceptions
      operationId: listExceptionNotes
      security:
        - BearerAuth: []
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
          description: Exception ID (UUID).
      responses:
        '200':
          description: Notes history for the exception.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExceptionNote'
              example:
                status: SUCCESS
                message: Exception notes listed
                data:
                  - note: Consumer SSN re-verified by LexisNexis; bank statement matched. Closing exception.
