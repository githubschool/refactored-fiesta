openapi: 3.1.0
info:
  title: Purpose Fintech API
  description: Complete API reference for the Purpose Fintech Payments platform.
  version: '1.0'
  x-release-date: '2026-04-27 10:49 PT'
  x-build: 'Build 20.22'
  x-build-summary: 'v20.21 — Restoration build. Rebased from the true v20.18 baseline (Exceptions entity with assigneeRole + notes endpoint, Batch entity, initiate* action naming, plural paths, PATCH-only mutations all intact). Re-applied the v20.19 error envelope sweep: all 342 non-2xx responses converted to status: FAILURE + errors[] array + traceId; ErrorItem schema added with ERR-### opaque code pattern and optional id/externalReferenceId for 409 conflicts; ErrorEnvelope schema rebuilt; legacy status: ERROR and singular error: blocks fully eliminated; Error Sample Pairing Rule enforced (ERR-### paired with <error message> placeholders, 341/341). Re-applied the v20.20 fee read consolidation: GET /enrollments/{enrollmentId}/fees/{feeId} retained on the unified Fee tag, GET /enrollments/{enrollmentId}/fees replaced with POST /enrollments/{enrollmentId}/fees/list (per project list-endpoint convention), source field distinguishes SUBSCRIBER vs PURPOSE pathways, both parties see each other''s fees. Subscriber/Purpose Fee tags retain their Create/Update/Cancel/Suspend/Reinstate pathways with no duplicate Get/List. Fixed two stragglers where initiate*Cancellation on subscriber/purpose fees were declared as PUT — corrected to POST per the initiate* convention. Exception object redesign remains parked for a later build.'
  contact:
    name: PFT Support
    email: support@purposefintech.com
servers:
  - url: https://api.purposefintech.com
    description: Production
  - url: https://sandbox.api.purposefintech.com
    description: Sandbox
security:
  - BearerAuth: []
tags:
  - name: Address
  - name: Advance
  - name: Bank Account
  - name: Batch
  - name: Consumer
  - name: Creditor
  - name: Debt
  - name: Document
  - name: Draft
  - name: Enrollment
  - name: Exceptions
  - name: Fee
  - name: Payment
  - name: Recoup
  - name: Refund
  - name: Settlement
  - name: Withdrawal
paths:
  /api/v1/consumers:
    post:
      summary: Create Consumer
      description: Creates a new consumer record. This is the first step of the enrollment onboarding process. Upon creation, an OFAC screening is initiated as a manual, offline process. Note that full CIP verification is deferred until the Enrollment Activation flow is initiated.
      tags:
        - Consumer
      operationId: post_create_a_consumer
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Returns the full consumer object. HTTP 201 Created.
          content:
            application/json:
              example:
                status: SUCCESS
                message: Consumer created successfully
                data:
                  id: 71b2c3d4-e5f6-41d4-a716-446655440001
                  externalReferenceId: EXT_REF_0001
                  firstName: Jane
                  middleInitial: M
                  lastName: Doe
                  emailAddress: jane.doe@email.com
                  phoneNumber: '+14155551234'
                  ssnLast4: '6789'
                  dateOfBirth: '1985-03-15'
                  verificationStatuses:
                    cip: NOT_INITIATED
                    ofac: NOT_INITIATED
                    documentary: NOT_INITIATED
                  addresses: []
                  bankAccounts: []
                  documents: []
                  metaData:
                    acquisition_source: referral_partner_01
                    campaign_id: spring_2024
                  auditInfo:
                    created:
                      at: '2025-08-15T14:30:00Z'
                      by:
                        id: 91b2c3d4-e5f6-41d4-a716-446655440002
                        name: AdminUser
                    updated:
                      at: '2025-08-15T14:30:00Z'
                      by:
                        id: 91b2c3d4-e5f6-41d4-a716-446655440002
                        name: AdminUser
              schema:
                type: object
                properties:
                  status:
                    type: string
                    readOnly: true
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      externalReferenceId:
                        type: string
                        maxLength: 50
                      firstName:
                        type: string
                        maxLength: 50
                      middleInitial:
                        type: string
                      lastName:
                        type: string
                        maxLength: 50
                      emailAddress:
                        type: string
                        format: email
                      phoneNumber:
                        type: string
                      ssnLast4:
                        type: string
                        readOnly: true
                      dateOfBirth:
                        type: string
                        format: date
                      verificationStatuses:
                        type: object
                        readOnly: true
                        description: System-managed verification statuses for this consumer. All checks are asynchronous; CIP and OFAC are kicked off immediately on consumer creation, while Documentary verification is triggered when supporting documents are uploaded. Clients cannot set these fields directly.
                        properties:
                          cip:
                            type: string
                            readOnly: true
                            enum:
                              - NOT_INITIATED
                              - VERIFICATION_IN_PROGRESS
                              - VERIFICATION_SUCCESS
                              - VERIFICATION_FAILURE
                          ofac:
                            type: string
                            readOnly: true
                            enum:
                              - NOT_INITIATED
                              - VERIFICATION_IN_PROGRESS
                              - CLEARED
                              - FLAGGED
                          documentary:
                            type: string
                            readOnly: true
                            enum:
                              - NOT_INITIATED
                              - VERIFICATION_IN_PROGRESS
                              - VERIFICATION_SUCCESS
                              - VERIFICATION_FAILURE
                      addresses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            externalReferenceId:
                              type: string
                              maxLength: 50
                            type:
                              type: string
                            addressLine1:
                              type: string
                            addressLine2:
                              type: string
                            city:
                              type: string
                            state:
                              type: string
                            zipCode:
                              type: string
                      bankAccounts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            externalReferenceId:
                              type: string
                              maxLength: 50
                            bankName:
                              type: string
                            achRoutingNumber:
                              type: string
                            accountNumberLast4:
                              type: string
                            accountType:
                              type: string
                              enum:
                                - CHECKING
                                - SAVINGS
                            accountHolderName:
                              type: string
                              maxLength: 50
                            statuses:
                              type: object
                              properties:
                                 accountStatus:
                                   type: string
                                   description: Vendor verification result for the bank account (routing + account number) as assessed by the verification provider.
                                   default: NOT_INITIATED
                                   enum:
                                     - NOT_INITIATED
                                     - VERIFICATION_SUCCESS
                                     - VERIFICATION_FAILED
                                     - UNVERIFIED
                                 ownershipStatus:
                                   type: string
                                   description: Vendor verification result for account ownership (account holder name vs. consumer identity on file).
                                   default: NOT_INITIATED
                                   enum:
                                     - NOT_INITIATED
                                     - VERIFICATION_SUCCESS
                                     - VERIFICATION_FAILED
                                     - UNVERIFIED
                                 processingStatus:
                                   type: string
                                   description: ACH draft processing eligibility, driven by ACH return outcomes.
                                   default: NOT_INITIATED
                                   enum:
                                     - NOT_INITIATED
                                     - ACTIVE
                                     - IN_ERROR
                                     - DEBIT_RESTRICTED
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            entityType:
                              type: string
                            entityId:
                              type: string
                            documentType:
                              $ref: '#/components/schemas/DocumentType'
                            fileName:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                      metaData:
                        type: object
                        description: Custom key-value pairs (max 50 properties). This field is fully replaced on update — include all desired keys in each request. Omitted keys are removed.
                        maxProperties: 50
                        additionalProperties:
                          type: string
                      auditInfo:
                        type: object
                        description: Created/updated timestamps and actor info
                        properties:
                          created:
                            type: object
                            properties:
                              at:
                                type: string
                                format: date-time
                              by:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                          updated:
                            type: object
                            properties:
                              at:
                                type: string
                                format: date-time
                              by:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 7b453fbf-70e6-48c6-9c10-ffd91e21a666
        '400':
          description: Bad Request — validation error.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 04611f89-eb97-4497-9f83-6030cbcd7c20
        '409':
          description: Conflict — externalReferenceId, ssn, or emailAddress already exists.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-83
                  message: "A consumer with same external reference id already exists"
                traceId: f99445b7-01c1-4766-9044-249f904d5163
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalReferenceId:
                  type: string
                  maxLength: 50
                  description: Third-party system identifier. Optional. Must be unique if provided.
                firstName:
                  type: string
                  maxLength: 50
                  description: Legal first name. Letters, hyphens, and apostrophes only.
                middleInitial:
                  type: string
                  description: Middle initial
                  maxLength: 1
                lastName:
                  type: string
                  maxLength: 50
                  description: Legal last name. Letters, hyphens, and apostrophes only.
                emailAddress:
                  type: string
                  format: email
                  description: RFC 5322 email. Case-insensitive, trimmed. Must be unique (max 255)
                  maxLength: 255
                phoneNumber:
                  type: string
                  description: Required. E.164 format phone number (e.g., +14155551234). Must be unique across all consumers (409 Conflict if duplicate).
                  pattern: ^\+[1-9]\d{1,14}$
                ssn:
                  type: string
                  description: Required. 9-digit numeric string. Must not contain hyphens or spaces. No 000, 666, or 9xx prefix. Must be unique across all consumers (409 Conflict if duplicate). (write-only)
                  pattern: ^\d{9}$
                  writeOnly: true
                dateOfBirth:
                  type: string
                  format: date
                  description: Date of birth in YYYY-MM-DD format. Consumer must be ≥ 18 years of age.
                metaData:
                  type: object
                  description: Custom key-value pairs (max 50 properties). This field is fully replaced on update — include all desired keys in each request. Omitted keys are removed.
                  maxProperties: 50
                  additionalProperties:
                    type: string
              required:
                - firstName
                - lastName
                - emailAddress
                - phoneNumber
                - ssn
                - dateOfBirth
            example:
              externalReferenceId: EXT_REF_0001
              firstName: Jane
              middleInitial: M
              lastName: Doe
              emailAddress: jane.doe@email.com
              phoneNumber: '+14155551234'
              ssn: '123456789'
              dateOfBirth: '1985-03-15'
              metaData:
                acquisition_source: referral_partner_01
