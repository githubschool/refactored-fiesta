  /api/v1/withdrawals/{withdrawalId}:
    get:
      summary: Fetch Withdrawal
      description: |
        Fetches the full record for a specific withdrawal, including the system-selected bank account and address, check details (when applicable), status, and audit information.

        The response echoes the bankAccountId and addressId that the system selected for the transaction. For CHECK withdrawals, the checkDetails block carries the check status and document IDs for the front and back check images (used by customer support and as evidence). checkDetails is null when the withdrawal was issued via ACH.
      tags:
        - Withdrawal
      operationId: fetchWithdrawal
      security:
        - BearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
          description: Withdrawal ID (UUID).
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              example:
                status: SUCCESS
                message: Withdrawal fetched successfully
                data:
                  id: a1f3c8d2-7b4e-4c6a-9d5f-0e8b2c1a3f47
                  externalReferenceId: EXT-WTH-001
                  enrollmentId: d4a6fbeb-ae7b-4f9d-c081-3b1e5f4d6c7a
                  amount: 500.00
                  dueDate: '2025-09-15'
                  method: CHECK
                  reason: CONSUMER_REQUEST
                  bankAccountId:
                  addressId: f6c8bd0d-c09d-4b1f-e2a3-5d3a7b6f8e9c
                  checkDetails:
                    status: MAILED
                    frontImageDocumentId: 07d9ce1e-d1ae-4c20-f3b4-6e4b8c7a9f0d
                    backImageDocumentId: 18eadf2f-e2bf-4d31-04c5-7f5c9d8b0a1e
                  status: SCHEDULED
                  notes: Consumer requested partial withdrawal
                  metaData:
                    source: api
                    campaign: q3_disbursement
                  auditInfo:
                    created:
                      at: '2025-09-01T10:00:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
                    updated:
                      at: '2025-09-02T08:30:00Z'
                      by:
                        id: 4b1d0252-15e2-4064-37f8-a28cfc0be3d4
                        name: System API
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Withdrawal ID (UUID).
                      externalReferenceId:
                        type: string
                        maxLength: 50
                        description: Client-supplied reference for idempotency and reconciliation.
                      enrollmentId:
                        type: string
                        description: Parent enrollment ID (UUID).
                      amount:
                        type: number
                        format: decimal
                        minimum: 0.01
                      dueDate:
                        type: string
                        format: date
                      method:
                        type: string
                        enum:
                          - ACH
                          - CHECK
                      reason:
                        type: string
                        enum:
                          - CONSUMER_REQUEST
                          - OVERPAYMENT_REFUND
                          - PROGRAM_EXIT
                          - HARDSHIP
                          - DUPLICATE_DEPOSIT
                          - DISPUTE_RESOLUTION
                          - OTHER
                      bankAccountId:
                        type:
                          - string
                          - 'null'
                        description: System-selected bank account (ACH). Null for CHECK.
                      addressId:
                        type:
                          - string
                          - 'null'
                        description: System-selected address (CHECK). Null for ACH.
                      checkDetails:
                        type:
                          - object
                          - 'null'
                        description: Check details (CHECK only). Null for ACH withdrawals.
                        properties:
                          status:
                            type: string
                            enum:
                              - PRINTED
                              - MAILED
                              - IN_TRANSIT
                              - OUT_FOR_DELIVERY
                              - DELIVERED
                              - RETURNED_TO_SENDER
                              - STOP_REQUESTED
                              - CLEARED
                            description: "Check lifecycle status: PRINTED → MAILED → IN_TRANSIT → OUT_FOR_DELIVERY → DELIVERED | RETURNED_TO_SENDER. STOP_REQUESTED is an in-progress state pending bank confirmation. CLEARED is terminal."
                          frontImageDocumentId:
                            type:
                              - string
                              - 'null'
                            description: Document ID for the front image of the check.
                          backImageDocumentId:
                            type:
                              - string
                              - 'null'
                            description: Document ID for the back image of the check.
                      status:
                        type: string
                        enum:
                          - SCHEDULED
                          - IN_PROCESS
                          - SUBMITTED
                          - COMPLETED
                          - SUCCESS
                          - RETURNED
                          - FAILED
                          - CANCELLED
                          - STOPPED
                        description: |
                          Withdrawal lifecycle status.

                          Allowed transitions:
                          - SCHEDULED → IN_PROCESS
                          - IN_PROCESS → SUBMITTED (W)
                          - SUBMITTED → COMPLETED (W)
                          - COMPLETED → RETURNED (Terminal) (W,E)
                          - COMPLETED → SUCCESS (Terminal) (W)
                          - SUBMITTED → FAILED (Terminal) (W,E)
                          - SCHEDULED → CANCELLED (Terminal)
                          - IN_PROCESS → STOPPED (Terminal) (W)
                          - SUBMITTED → STOPPED (Terminal) (W)
                          - COMPLETED → STOPPED (Terminal) (W)

                          `STOPPED` is reached only for CHECK withdrawals after the bank confirms a stop request triggered by `initiateStop`; it is system-set via webhook.

                          Typical ACH path: SCHEDULED → IN_PROCESS → SUBMITTED → COMPLETED → SUCCESS.

                          For CHECK withdrawals, shipment milestones are tracked separately in the nested field `checkDetails.status` — values: `PRINTED`, `MAILED`, `IN_TRANSIT`, `OUT_FOR_DELIVERY`, `DELIVERED`, `RETURNED_TO_SENDER`, `STOP_REQUESTED`, `CLEARED`. These are **not** top-level `status` values. The top-level `status` remains `SUBMITTED` throughout shipment and only advances to `COMPLETED` once funds clear.
                      notes:
                        type: string
                        maxLength: 255
                        description: Latest note for this record (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
                      metaData:
                        type: object
                        additionalProperties:
                          type: string
                        maxProperties: 50
