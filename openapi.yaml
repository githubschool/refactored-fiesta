                              - RETURNED_TO_SENDER
                              - STOP_REQUESTED
                              - CLEARED
                            description: "Check lifecycle status: PRINTED → MAILED → IN_TRANSIT → OUT_FOR_DELIVERY → DELIVERED | RETURNED_TO_SENDER. STOP_REQUESTED is an in-progress state pending bank confirmation. CLEARED is terminal."
