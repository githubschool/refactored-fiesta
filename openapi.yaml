  /api/v1/enrollments/{enrollmentId}/withdrawals/{withdrawalId}/initiateCancellation:
    post:
      summary: Initiate Withdrawal Cancellation
      description: |
        Initiates asynchronous cancellation of a withdrawal. The withdrawal terminates at status `CANCELLED`.

        Allowed only when `status = SCHEDULED`. Returns `409 Conflict` with `code: INVALID_STATE` and the current status if the withdrawal is in any other state. Once a withdrawal has been released (ACH submitted, or check printed/mailed), use Initiate Withdrawal Stop instead.

        Requires a mandatory `reason` (enum). Returns the full withdrawal object (mirror-GET).
      tags:
        - Withdrawal
      operationId: initiateWithdrawalCancellation
      security:
        - BearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
          description: Enrollment ID (UUID).
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
          description: Withdrawal ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - CONSUMER_REQUEST
                    - OVERPAYMENT_REFUND
                    - PROGRAM_EXIT
                    - HARDSHIP
                    - DUPLICATE_DEPOSIT
                    - DISPUTE_RESOLUTION
                    - OTHER
                  description: Reason for cancellation. Required.
                notes:
                  type: string
                  maxLength: 255
                  description: Latest note for this record (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
              required:
                - reason
            example:
              reason: CONSUMER_REQUEST
              notes: Consumer called requesting cancellation; changed their mind.
      responses:
        '202':
          description: Cancellation accepted (asynchronous). Returns the current withdrawal (mirror-GET); the terminal state will be `CANCELLED` once processing completes.
