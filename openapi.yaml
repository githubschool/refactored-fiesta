  /api/v1/enrollments/{enrollmentId}/refunds/{refundId}/initiateCancellation:
    post:
      summary: Initiate Refund Cancellation
      description: |
        Initiates asynchronous cancellation of a pending refund before it enters processing. Allowed only when `status = SCHEDULED`. Returns `409 Conflict` with `code: INVALID_STATE` if the refund has already been released.

        Asynchronous action endpoint. Requires a mandatory `reason`. Returns the full Refund object (mirror-GET).
      tags:
        - Refund
      operationId: initiateRefundCancellation
      security:
        - BearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          description: Enrollment ID (UUID).
          schema:
            type: string
        - name: refundId
          in: path
          required: true
          description: Refund ID (UUID).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - CONSUMER_REQUEST
                    - OVERPAYMENT_REFUND
                    - PROGRAM_EXIT
                    - HARDSHIP
                    - DUPLICATE_DEPOSIT
                    - DISPUTE_RESOLUTION
                    - OTHER
                  description: Reason for the action. Required for audit and compliance.
                notes:
                  type: string
                  maxLength: 255
                  description: Optional latest note (max 255 chars). Free-text.
                metaData:
                  type: object
                  additionalProperties:
                    type: string
                  maxProperties: 50
                  description: Optional client metaData (max 50 keys, full-replace semantics).
            example:
              reason: CONSUMER_REQUEST
              notes: Cancelled at consumer request via support channel.
      responses:
        '202':
          description: Accepted — action queued. Final state transition is webhook-driven.
          content:
            application/json:
              example:
                status: SUCCESS
                message: Refund action accepted and queued.
                data:
                  id: 5f4a2c91-3b8e-4d0a-9c1f-2b6e8f3d7a40
                  status: SCHEDULED
              schema:
                type: object
                properties:
                  status:
                    type: string
                    readOnly: true
                    enum:
                      - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
                    description: Full Refund object (mirror-GET).
        '400':
          description: Bad Request — validation error.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: db1f8455-215c-4b04-9c03-2e7ce3b0aee6
        '401':
          description: Unauthorized.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 53b05f21-add3-49ed-9356-01ec4b3c5425
        '404':
          description: Not Found — Refund not found under the specified parent.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                - code: ERR-###
                  message: <error message>
                traceId: 4a325f08-4e6b-4b10-99a8-251fadc139e9
        '422':
          description: Unprocessable Entity — business-rule validation failed.
