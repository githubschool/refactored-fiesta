                                  name:
                                    type: string
                          updated:
                            type: object
                            properties:
                              at:
                                type: string
                                format: date-time
                              by:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
        '404':
          description: Withdrawal not found.
          content:
            application/json:
              example:
                status: FAILURE
                errors:
                  - code: NOT_FOUND
                    message: No withdrawal found with the provided identifier.
    patch:
      summary: Update Withdrawal
      description: |
        Updates on withdrawal can be performed only when status is SCHEDULED. Only the following can be updated.
        - amount
        - dueDate
        - method
        - reason
        - metaData (optional, full-replace semantics — client must send the complete object on every update)
        - notes (optional, latest-note string, max 255 chars)

        Returns the full updated withdrawal object (mirror-GET).
      tags:
        - Withdrawal
      operationId: updateWithdrawal
      security:
        - BearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
          description: Withdrawal ID (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                dueDate:
                  type: string
                  format: date
                method:
                  type: string
                  enum:
                    - ACH
