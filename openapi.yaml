                    - OVERPAYMENT_REFUND
                    - PROGRAM_EXIT
                    - HARDSHIP
                    - DUPLICATE_DEPOSIT
                    - DISPUTE_RESOLUTION
                    - OTHER
                notes:
                  type: string
                  maxLength: 255
                  description: Latest note for this record (max 255 chars). Free-text. Historical notes are accessible via the Timeline.
                metaData:
                  type: object
                  description: Full-replace semantics. Send the complete object on every update.
                  additionalProperties:
