        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                drafts:
                  type: array
                  description: Array of draft objects to be created. Each must include externalReferenceId, amount, dueDate, and authorization.
                  items:
                    type: object
                    properties:
                      externalReferenceId:
                        type: string
                        maxLength: 50
                        description: Unique external identifier.
                      type:
                        type: string
                        enum:
                          - PRE_NOTE
                          - DRAFT
                        default: DRAFT
                        description: Draft type. PRE_NOTE = zero-dollar verification (amount must be 0, frequency must be ONE_TIME). DRAFT = standard money-movement. Defaults to DRAFT. Immutable after creation.
                      amount:
                        type: number
                        format: decimal
                        description: When type is DRAFT, > 0 and <= 50,000. When type is PRE_NOTE, must be 0.
                      dueDate:
                        type: string
                        format: date
                        description: Today or future date (YYYY-MM-DD).
                      authorization:
                        type: object
